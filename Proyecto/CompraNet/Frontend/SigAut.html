<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompraNet | Registro</title>

    <link rel="stylesheet" href="CSS/StyleSigAut.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body>

    <header>

        <h1>CompraNet</h1>

        <p class="subtitulo">
            Crea tu cuenta y comienza a disfrutar de una mejor experiencia de compra.
        </p>

    </header>

    <main>

        <section class="cubo">

            <form id="formRegistro">

                <div class="progreso">
                    <div class="barra" id="barra"></div>
                </div>

                <label class="info">Correo electrónico</label>

                <input
                    class="formulario"
                    type="email"
                    id="correo"
                    placeholder="ejemplo@gmail.com"
                    required>

                <small id="mensajeCorreo"></small>


                <label class="info">Teléfono</label>

                <input
                    class="formulario"
                    type="tel"
                    id="telefono"
                    required>


                <label class="info">Ciudad / Municipio</label>

                <input
                    class="formulario"
                    type="text"
                    id="ciudad"
                    required>


                <label class="info">Nombre completo</label>

                <input
                    class="formulario"
                    type="text"
                    id="nombre"
                    required>


                <label class="info">Contraseña</label>

                <div class="contenedorPassword">

                    <input
                        class="formulario"
                        type="password"
                        id="password"
                        required>

                    <i class="fa-solid fa-eye" id="ojo"></i>

                </div>

                <div class="seguridad">

                    <div class="nivel" id="nivel"></div>

                </div>

                <small id="textoSeguridad"></small>


                <label class="info">Confirmar contraseña</label>

                <div class="contenedorPassword">

                    <input
                        class="formulario"
                        type="password"
                        id="confirmPassword"
                        required>

                    <i class="fa-solid fa-eye" id="ojo2"></i>

                </div>

                <small id="mensajePassword"></small>


                <div class="terminosycondiciones">

                    <input
                        type="checkbox"
                        id="terminos"
                        required>

                    <label for="terminos">
                        Acepto que me contacten por SMS y WhatsApp.
                    </label>

                </div>


                <div class="botonContinuar">

                    <button type="submit">

                        Crear cuenta

                    </button>

                </div>

            </form>

        </section>


        <section class="mensajeFinal">

            <p>

                Al continuar aceptas nuestros

                <span>Términos de uso</span>

                y autorizas el tratamiento de tus datos personales de acuerdo con nuestra

                <span>Política de privacidad</span>.

            </p>

        </section>

    </main>

    <div class="modal" id="modal">

        <div class="contenidoModal">

            <i class="fa-solid fa-circle-check"></i>

            <h2>¡Registro exitoso!</h2>

            <p>Tu cuenta ha sido creada correctamente.</p>

            <button id="cerrarModal">

                Aceptar

            </button>

        </div>

    </div>

    <script src="JS/Registro.js"></script>

</body>

</html>
